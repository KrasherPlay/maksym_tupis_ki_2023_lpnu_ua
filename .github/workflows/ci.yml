name: Java Maven CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        java: ["17"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B -ntp -Pdefault test

      - name: Build and test on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Pdefault test
